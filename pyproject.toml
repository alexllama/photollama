[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photollama"
version = "0.1.0"
description = "A fast, themeable image viewer for Omarchy/Hyprland"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
photollama = "photollama.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["photollama"]
